name: Benchmark
on:
  workflow_dispatch:
    inputs:
      requests:
        description: Number of writes
        required: true
        default: '10000'
      concurrency:
        description: Parallel workers
        required: true
        default: '16'
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: docker compose up --build --detach
      - name: Run benchmark
        run: ./scripts/benchmark.sh '${{ inputs.requests }}' '${{ inputs.concurrency }}' benchmark-results.json 10m
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.json
      - if: always()
        run: docker compose down --volumes
