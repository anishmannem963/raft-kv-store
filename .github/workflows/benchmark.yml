name: Benchmark
on:
  workflow_dispatch:
    inputs:
      requests:
        description: Number of writes
        required: true
        default: '10000'
      concurrency:
        description: Space-separated concurrency levels
        required: true
        default: '1 8 16'
      repetitions:
        description: Runs per concurrency level
        required: true
        default: '5'
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Run benchmark suite
        run: ./scripts/benchmark-suite.sh '${{ inputs.requests }}' '${{ inputs.repetitions }}' '${{ inputs.concurrency }}' benchmark-suite-results 10m
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-suite-results
          path: benchmark-suite-results
      - if: always()
        run: docker compose down --volumes
