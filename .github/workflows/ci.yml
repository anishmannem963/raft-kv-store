name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: gofmt -w .
      - run: go vet ./...
      - run: go test -race -count=5 ./...
      - run: go build ./cmd/node
      - run: go build ./cmd/benchmark
      - run: go build ./cmd/benchmark-summary
      - run: go build ./cmd/fault-summary
      - name: Verify replication and leader failover
        run: |
          docker compose up --build --detach
          trap 'docker compose down --volumes' EXIT
          ./scripts/smoke-test.sh
          ./scripts/leader-failure-test.sh | tee /tmp/failover-result.txt
          echo '### Leader failover' >> "$GITHUB_STEP_SUMMARY"
          tail -1 /tmp/failover-result.txt >> "$GITHUB_STEP_SUMMARY"
          ./scripts/network-partition-test.sh | tee /tmp/partition-result.txt
          echo '### Network partition recovery' >> "$GITHUB_STEP_SUMMARY"
          tail -1 /tmp/partition-result.txt >> "$GITHUB_STEP_SUMMARY"
          ./scripts/snapshot-test.sh | tee /tmp/snapshot-result.txt
          echo '### Snapshot installation' >> "$GITHUB_STEP_SUMMARY"
          tail -1 /tmp/snapshot-result.txt >> "$GITHUB_STEP_SUMMARY"
          docker compose down --volumes
          docker compose up --detach
          ./scripts/benchmark.sh 300 8 benchmark-results.json 2m
          ./scripts/benchmark-suite.sh 40 2 "1 4" benchmark-suite-results 2m
          ./scripts/fault-matrix.sh 1 1 1 1 fault-matrix-results
      - uses: actions/upload-artifact@v4
        with:
          name: ci-benchmark-results
          path: |
            benchmark-results.json
            benchmark-suite-results
            fault-matrix-results
